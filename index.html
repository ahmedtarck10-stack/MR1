<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR1 - AR/VR/MR Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/webxr/XRButton.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #667eea;
            max-width: 420px;
            z-index: 100;
            max-height: 85vh;
            overflow-y: auto;
        }

        .ui-panel h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .ui-panel p {
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .section h3 {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(102, 126, 234, 0.1);
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.2);
            transform: scale(1.02);
        }

        .upload-area.active {
            border-color: #4ecdc4;
            background: rgba(78, 205, 196, 0.2);
        }

        .upload-text {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.85em;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
        }

        .file-item {
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .file-item button {
            padding: 4px 8px;
            font-size: 0.8em;
            background: #ff6b6b;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button.active {
            background: #764ba2;
        }

        .status {
            padding: 10px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        .status.loading {
            color: #667eea;
        }

        .status.success {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .info-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 0.85em;
            color: #aaa;
            max-width: 420px;
        }

        .info-bottom p {
            margin: 5px 0;
        }

        .info-bottom strong {
            color: #667eea;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 10px;
        }

        .spinner {
            border: 3px solid #667eea;
            border-top: 3px solid #764ba2;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .ui-panel {
                max-width: 95vw;
                padding: 15px;
                font-size: 0.9em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            button {
                padding: 8px 12px;
            }

            .info-bottom {
                max-width: 95vw;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <h1>🎯 MR1</h1>
        <p>Interactive 3D AR/VR/MR Experience</p>

        <div class="section">
            <h3>📁 Upload 3D Model</h3>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click();">
                <div class="upload-text">📤 Click or Drag & Drop</div>
                <div class="upload-hint">Supported: GLB, GLTF, USDZ (Max 50MB)</div>
            </div>
            <input type="file" id="fileInput" accept=".glb,.gltf,.usdz" multiple onchange="handleFileSelect(event)">
            <div class="file-list" id="fileList"></div>
            <div class="status" id="status"></div>
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p>Loading model...</p>
            </div>
        </div>

        <div class="section">
            <h3>🎮 Main Controls</h3>
            <div class="controls">
                <button onclick="toggleRotation()">▶ Auto Rotate</button>
                <button onclick="changeColor()">🎨 Color</button>
                <button onclick="toggleLight()">💡 Light</button>
                <button onclick="resetView()">↺ Reset View</button>
            </div>
        </div>

        <div class="section">
            <h3>🥽 AR/MR Mode</h3>
            <div class="controls">
                <button id="arButton" onclick="initAR()" style="grid-column: 1/-1;">📱 Start AR</button>
                <button onclick="downloadModel()">⬇ Download</button>
                <button onclick="clearScene()">🗑️ Clear</button>
            </div>
        </div>

        <div class="section">
            <h3>⚙️ Settings</h3>
            <div class="controls" style="gap: 5px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="wireframe" onchange="toggleWireframe()"> Wireframe
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="shadows" checked onchange="toggleShadows()"> Shadows
                </label>
            </div>
        </div>
    </div>

    <div class="info-bottom">
        <p><strong>🖱️ Controls:</strong></p>
        <p>Left Click + Drag = Rotate</p>
        <p>Right Click + Drag = Pan</p>
        <p>Scroll = Zoom</p>
    </div>

    <script>
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 500, 2000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.z = 5;

        const canvas = document.createElement('canvas');
        canvas.id = 'canvas';
        document.body.appendChild(canvas);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.xr.enabled = true;

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 4;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 100;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x667eea, 1, 100);
        pointLight.position.set(-10, 10, 10);
        pointLight.castShadow = true;
        scene.add(pointLight);

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a3e });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -10;
        ground.receiveShadow = true;
        scene.add(ground);

        // Loaders
        const gltfLoader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        gltfLoader.setDRACOLoader(dracoLoader);

        let loadedModels = [];
        let isAutoRotating = true;

        // File Upload Handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const status = document.getElementById('status');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('active');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('active');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        });

        function handleFileSelect(event) {
            const files = event.target.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            for (let file of files) {
                if (['glb', 'gltf', 'usdz'].some(ext => file.name.toLowerCase().endsWith('.' + ext))) {
                    loadModel(file);
                } else {
                    showStatus('❌ Invalid file: ' + file.name + '. Use GLB, GLTF, or USDZ', 'error');
                }
            }
        }

        function loadModel(file) {
            const reader = new FileReader();
            
            reader.onload = (e) => {
                loadingSpinner.style.display = 'block';
                showStatus('⏳ Loading ' + file.name + '...', 'loading');

                try {
                    const url = URL.createObjectURL(new Blob([e.target.result], { type: file.type }));
                    
                    gltfLoader.load(url, (gltf) => {
                        const model = gltf.scene;
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });

                        // Center and scale model
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 10 / maxDim;
                        
                        model.position.sub(center.multiplyScalar(scale));
                        model.scale.multiplyScalar(scale);

                        scene.add(model);
                        loadedModels.push(model);

                        addFileToList(file.name, model);
                        showStatus('✅ ' + file.name + ' loaded successfully!', 'success');
                        loadingSpinner.style.display = 'none';

                        // Auto fit camera
                        const bbox = new THREE.Box3().setFromObject(model);
                        const center2 = bbox.getCenter(new THREE.Vector3());
                        const distance = bbox.getSize(new THREE.Vector3()).length();
                        camera.position.copy(center2);
                        camera.position.z += distance;
                        controls.target.copy(center2);
                        controls.update();

                    }, undefined, (error) => {
                        showStatus('❌ Error loading model: ' + error.message, 'error');
                        loadingSpinner.style.display = 'none';
                    });
                } catch (err) {
                    showStatus('❌ Error: ' + err.message, 'error');
                    loadingSpinner.style.display = 'none';
                }
            };

            reader.onerror = () => {
                showStatus('❌ Failed to read file: ' + file.name, 'error');
                loadingSpinner.style.display = 'none';
            };

            reader.readAsArrayBuffer(file);
        }

        function addFileToList(name, model) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <span>📦 ${name}</span>
                <button onclick="removeModel(this)">✕</button>
            `;
            fileList.appendChild(fileItem);
        }

        function removeModel(button) {
            const index = Array.from(fileList.children).indexOf(button.parentElement);
            if (loadedModels[index]) {
                scene.remove(loadedModels[index]);
                loadedModels.splice(index, 1);
            }
            button.parentElement.remove();
            showStatus('Model removed', 'success');
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
        }

        // UI Functions
        function toggleRotation() {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
            event.target.textContent = isAutoRotating ? '⏸ Stop' : '▶ Rotate';
            event.target.classList.toggle('active');
        }

        function changeColor() {
            const colors = [0x667eea, 0x764ba2, 0xff6b6b, 0x4ecdc4, 0xffe66d, 0xff006e];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.color.setHex(color));
                        } else {
                            child.material.color.setHex(color);
                        }
                    }
                });
            });
            showStatus('🎨 Color changed!', 'success');
        }

        function toggleLight() {
            directionalLight.intensity = directionalLight.intensity > 0 ? 0 : 0.8;
            pointLight.intensity = pointLight.intensity > 0 ? 0 : 1;
            showStatus('💡 Light toggled', 'success');
        }

        function resetView() {
            if (loadedModels.length > 0) {
                const bbox = new THREE.Box3().setFromObject(loadedModels[0]);
                const center = bbox.getCenter(new THREE.Vector3());
                const distance = bbox.getSize(new THREE.Vector3()).length();
                camera.position.copy(center);
                camera.position.z += distance;
                controls.target.copy(center);
                controls.update();
                showStatus('↺ View reset', 'success');
            } else {
                showStatus('⚠️ No model loaded', 'error');
            }
        }

        function clearScene() {
            loadedModels.forEach(model => scene.remove(model));
            loadedModels = [];
            fileList.innerHTML = '';
            showStatus('🗑️ Scene cleared', 'success');
        }

        function toggleWireframe() {
            const enabled = document.getElementById('wireframe').checked;
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material.wireframe = enabled;
                    }
                });
            });
        }

        function toggleShadows() {
            const enabled = document.getElementById('shadows').checked;
            renderer.shadowMap.enabled = enabled;
        }

        function downloadModel() {
            showStatus('💾 Export feature coming soon!', 'loading');
        }

        // AR/MR Function
        async function initAR() {
            if (loadedModels.length === 0) {
                showStatus('⚠️ Please load a model first!', 'error');
                return;
            }

            try {
                if (navigator.xr) {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (supported) {
                        const session = await navigator.xr.requestSession('immersive-ar', {
                            requiredFeatures: ['hit-test'],
                            optionalFeatures: ['dom-overlay'],
                            domOverlay: { root: document.body }
                        });
                        renderer.xr.setSession(session);
                        showStatus('📱 AR Mode activated!', 'success');
                    } else {
                        showStatus('⚠️ AR not supported on this device', 'error');
                    }
                } else {
                    showStatus('⚠️ WebXR not supported. Use Chrome on Android', 'error');
                }
            } catch (err) {
                showStatus('❌ AR Error: ' + err.message, 'error');
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Initial status
        showStatus('👋 Welcome! Upload a GLB, GLTF, or USDZ file to start', 'loading');
    </script>
</body>
</html>
