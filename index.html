<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR1 - AR/VR/MR Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
            max-width: 400px;
            z-index: 100;
        }

        .ui-panel h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .ui-panel p {
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button.active {
            background: #764ba2;
        }

        .info-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 0.9em;
            color: #aaa;
            max-width: 400px;
        }

        .info-bottom p {
            margin: 5px 0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #667eea;
            text-align: center;
            z-index: 50;
        }

        .loading h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .spinner {
            border: 4px solid #667eea;
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .ui-panel {
                max-width: 90vw;
                font-size: 0.9em;
                padding: 15px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            button {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <h2>🚀 MR1 Initializing</h2>
        <div class="spinner"></div>
        <p>Loading 3D Scene...</p>
    </div>

    <div class="ui-panel">
        <h1>🎯 MR1</h1>
        <p>Interactive 3D AR/VR/MR Experience</p>
        <div class="controls">
            <button onclick="changeShape('cube')">Cube</button>
            <button onclick="changeShape('sphere')">Sphere</button>
            <button onclick="changeShape('cone')">Cone</button>
            <button onclick="changeShape('torus')">Torus</button>
            <button onclick="toggleRotation()">▶ Rotate</button>
            <button onclick="changeColor()">🎨 Color</button>
            <button onclick="toggleLight()">💡 Light</button>
            <button onclick="resetScene()">↺ Reset</button>
        </div>
    </div>

    <div class="info-bottom">
        <p><strong>Controls:</strong></p>
        <p>🖱️ Drag to rotate camera</p>
        <p>🔍 Scroll to zoom</p>
        <p>⌨️ Use buttons to interact</p>
    </div>

    <script>
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 100, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const canvas = document.createElement('canvas');
        canvas.id = 'canvas';
        document.body.appendChild(canvas);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x667eea, 1);
        pointLight.position.set(-5, 5, 5);
        scene.add(pointLight);

        // Create initial geometry
        let currentShape = 'cube';
        let mesh;
        let isRotating = true;

        function createGeometry(shape) {
            let geometry;
            switch(shape) {
                case 'sphere':
                    geometry = new THREE.SphereGeometry(2, 64, 64);
                    break;
                case 'cone':
                    geometry = new THREE.ConeGeometry(2, 4, 64);
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(2, 0.8, 64, 100);
                    break;
                case 'cube':
                default:
                    geometry = new THREE.BoxGeometry(3, 3, 3);
            }
            return geometry;
        }

        function createMesh() {
            if (mesh) scene.remove(mesh);
            
            const geometry = createGeometry(currentShape);
            const material = new THREE.MeshPhongMaterial({
                color: 0x667eea,
                shininess: 100,
                wireframe: false
            });
            
            mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        createMesh();

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a3e });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Add particles for effect
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 500;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 200;
            positions[i + 1] = (Math.random() - 0.5) * 200;
            positions[i + 2] = (Math.random() - 0.5) * 200;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({ color: 0x667eea, size: 0.1 });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Mouse controls
        let isDragging = false;
        let mouse = { x: 0, y: 0 };

        document.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Zoom control
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.005;
            camera.position.z = Math.max(2, Math.min(20, camera.position.z));
        }, { passive: false });

        // UI Functions
        function changeShape(shape) {
            currentShape = shape;
            createMesh();
        }

        function toggleRotation() {
            isRotating = !isRotating;
            event.target.textContent = isRotating ? '⏸ Stop' : '▶ Rotate';
            event.target.classList.toggle('active');
        }

        function changeColor() {
            const colors = [0x667eea, 0x764ba2, 0xff6b6b, 0x4ecdc4, 0xffe66d, 0xff006e];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            mesh.material.color.setHex(randomColor);
        }

        function toggleLight() {
            directionalLight.intensity = directionalLight.intensity > 0 ? 0 : 0.8;
            pointLight.intensity = pointLight.intensity > 0 ? 0 : 1;
        }

        function resetScene() {
            isRotating = true;
            currentShape = 'cube';
            createMesh();
            camera.position.z = 5;
            mesh.rotation.set(0, 0, 0);
            mesh.material.color.setHex(0x667eea);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isRotating && mesh) {
                mesh.rotation.x += 0.005;
                mesh.rotation.y += 0.008;
            }

            if (isDragging && mesh) {
                mesh.rotation.y += mouse.x * 0.05;
                mesh.rotation.x += mouse.y * 0.05;
            }

            // Particles animation
            particles.rotation.x += 0.0001;
            particles.rotation.y += 0.0002;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Remove loading screen
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 1500);

        animate();
    </script>
</body>
</html>
