<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MR1 - AR/VR/MR Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #667eea;
            max-width: 400px;
            z-index: 100;
            max-height: 85vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .ui-panel h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.6em;
        }

        .section {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #444;
        }

        .section h3 {
            color: #764ba2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .upload-btn:active {
            transform: scale(0.95);
        }

        .upload-btn:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        #fileInput {
            display: none;
        }

        .file-list {
            max-height: 120px;
            overflow-y: auto;
            margin-top: 8px;
            padding: 8px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
        }

        .file-item {
            padding: 6px;
            background: rgba(0, 0, 0, 0.5);
            margin: 4px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
        }

        .file-item button {
            padding: 3px 8px;
            font-size: 0.75em;
            background: #ff6b6b;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            font-size: 0.85em;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: #764ba2;
        }

        .status {
            padding: 8px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 5px;
            margin-top: 8px;
            font-size: 0.85em;
            color: #aaa;
            min-height: 30px;
            display: flex;
            align-items: center;
        }

        .status.success {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .info-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 0.8em;
            color: #aaa;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .info-bottom p {
            margin: 3px 0;
        }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            background: rgba(102, 126, 234, 0.8);
            border: 2px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .icon-btn:hover {
            background: #667eea;
        }

        @media (max-width: 768px) {
            .ui-panel {
                max-width: 90vw;
                padding: 15px;
                font-size: 0.9em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .info-bottom {
                max-width: 90vw;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <h1>🎯 MR1</h1>

        <div class="section">
            <h3>📁 Load 3D Model</h3>
            <button class="upload-btn" id="uploadBtn">📤 Choose File (GLB/GLTF/USDZ)</button>
            <input type="file" id="fileInput" accept=".glb,.gltf,.usdz">
            <div class="file-list" id="fileList"></div>
            <div class="status" id="status">Ready to load model</div>
        </div>

        <div class="section">
            <h3>🎮 Controls</h3>
            <div class="controls">
                <button onclick="toggleRotation()">▶ Rotate</button>
                <button onclick="changeColor()">🎨 Color</button>
                <button onclick="toggleLight()">💡 Light</button>
                <button onclick="resetView()">↺ Reset</button>
                <button onclick="captureScreenshot()">📷 Screenshot</button>
                <button onclick="clearScene()">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <div class="top-right">
        <div class="icon-btn" onclick="togglePanel()" title="Toggle">⚙️</div>
        <div class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</div>
    </div>

    <div class="info-bottom">
        <p><strong>Controls:</strong></p>
        <p>Drag = Rotate | Scroll = Zoom</p>
    </div>

    <script>
        // Scene Setup
        let scene, camera, renderer, controls;
        let loadedModels = [];
        let isAutoRotating = true;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.z = 5;

            const canvas = document.createElement('canvas');
            canvas.id = 'canvas';
            document.body.appendChild(canvas);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 4;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x667eea, 1, 100);
            pointLight.position.set(-10, 10, 10);
            scene.add(pointLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a3e });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -10;
            scene.add(ground);

            animate();
        }

        // File Input Handler
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileList = document.getElementById('fileList');
        const status = document.getElementById('status');

        uploadBtn.addEventListener('click', () => {
            console.log('Upload button clicked');
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            console.log('File selected:', e.target.files);
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (!files || files.length === 0) {
                showStatus('No file selected', 'error');
                return;
            }

            for (let file of files) {
                console.log('Processing file:', file.name, file.type);
                if (['glb', 'gltf', 'usdz'].some(ext => file.name.toLowerCase().endsWith('.' + ext))) {
                    loadModel(file);
                } else {
                    showStatus('❌ Invalid: ' + file.name, 'error');
                }
            }
        }

        const gltfLoader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        gltfLoader.setDRACOLoader(dracoLoader);

        function loadModel(file) {
            const reader = new FileReader();
            
            reader.onload = (e) => {
                showStatus('⏳ Loading ' + file.name, 'loading');
                console.log('File loaded, parsing...');

                try {
                    const url = URL.createObjectURL(new Blob([e.target.result], { type: file.type }));
                    
                    gltfLoader.load(url, (gltf) => {
                        console.log('Model loaded successfully');
                        const model = gltf.scene;
                        
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });

                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 10 / maxDim;
                        
                        model.position.sub(center.multiplyScalar(scale));
                        model.scale.multiplyScalar(scale);

                        scene.add(model);
                        loadedModels.push(model);

                        addFileToList(file.name);
                        showStatus('✅ Loaded: ' + file.name, 'success');

                        const bbox = new THREE.Box3().setFromObject(model);
                        const center2 = bbox.getCenter(new THREE.Vector3());
                        const distance = bbox.getSize(new THREE.Vector3()).length();
                        camera.position.copy(center2);
                        camera.position.z += distance;
                        controls.target.copy(center2);
                        controls.update();

                    }, undefined, (error) => {
                        console.error('Loading error:', error);
                        showStatus('❌ Load error: ' + error.message.substring(0, 30), 'error');
                    });
                } catch (err) {
                    console.error('Error:', err);
                    showStatus('❌ Error: ' + err.message.substring(0, 30), 'error');
                }
            };

            reader.onerror = (err) => {
                console.error('Reader error:', err);
                showStatus('❌ File read failed', 'error');
            };

            reader.readAsArrayBuffer(file);
        }

        function addFileToList(name) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <span>📦 ${name}</span>
                <button onclick="removeModel(this)">✕</button>
            `;
            fileList.appendChild(fileItem);
        }

        function removeModel(button) {
            const index = Array.from(fileList.children).indexOf(button.parentElement);
            if (loadedModels[index]) {
                scene.remove(loadedModels[index]);
                loadedModels.splice(index, 1);
            }
            button.parentElement.remove();
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + (type || '');
        }

        // Controls
        function toggleRotation() {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
        }

        function changeColor() {
            const colors = [0x667eea, 0x764ba2, 0xff6b6b, 0x4ecdc4, 0xffe66d];
            const color = colors[Math.floor(Math.random() * colors.length)];
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.color.setHex(color));
                        } else {
                            child.material.color.setHex(color);
                        }
                    }
                });
            });
            showStatus('🎨 Color changed!', 'success');
        }

        function toggleLight() {
            scene.children.forEach(light => {
                if (light.isLight) {
                    light.intensity = light.intensity > 0 ? 0 : 1;
                }
            });
            showStatus('💡 Light toggled', 'success');
        }

        function resetView() {
            if (loadedModels.length > 0) {
                const bbox = new THREE.Box3().setFromObject(loadedModels[0]);
                const center = bbox.getCenter(new THREE.Vector3());
                const distance = bbox.getSize(new THREE.Vector3()).length();
                camera.position.copy(center);
                camera.position.z += distance;
                controls.target.copy(center);
            }
        }

        function clearScene() {
            loadedModels.forEach(model => scene.remove(model));
            loadedModels = [];
            fileList.innerHTML = '';
            showStatus('Scene cleared', 'success');
        }

        function captureScreenshot() {
            renderer.render(scene, camera);
            renderer.domElement.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'MR1-' + Date.now() + '.png';
                a.click();
                showStatus('📷 Screenshot saved!', 'success');
            });
        }

        function togglePanel() {
            const panel = document.querySelector('.ui-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initScene();
    </script>
</body>
</html>
